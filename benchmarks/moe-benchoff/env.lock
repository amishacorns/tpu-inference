# The environment every arm in this benchmark runs in. Asserted, not advisory.
#
# The kit reads this file before any cell is measured, compares every line
# against the installed distribution, and refuses to start on any difference.
# It is not a suggestion and it is not a floor: a cell measured in a different
# environment is a different measurement.
#
# THE ENV HASH ON A CELL IS NOT THIS FILE'S HASH. It is the sha256 of the
# full pip freeze of the interpreter that measured the cell (gates.env_hash),
# which covers every installed distribution and not only the ones this file
# pins. Two environments that satisfy this file line for line can still carry
# different env hashes, and that is the point: the file is what is asserted,
# the freeze is what is recorded.
#
# Generated by pip freeze from the virtual environment the cells were
# measured in, on Python 3.12.3, and trimmed to the packages this kit imports
# plus the device runtime. Every line below is verbatim from that freeze.
#
# Deliberately absent: the editable tpu-inference install that the same freeze
# lists. Arm source trees are bound by path and pinned by commit with per-file
# hashes, never by pip, and a pip-resolved tree would silently replace a pinned
# one. Installing this file must not fetch an arm.
#
# Reinstall with: pip install --no-deps -r env.lock

# The device runtime and the compiler. Changing any of these changes the
# numbers, so they are the reason this file is asserted.
